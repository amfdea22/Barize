# ─────────────────────────────────────────────────────────────
# BARIZE - Nginx Configuration
# Pilar 1: Rede cabeada com proxy reverso
# Pilar 2: Modo Quiosque (fullscreen, sem menus)
# ─────────────────────────────────────────────────────────────

upstream barize_api {
    server backend:8000;
    keepalive 32;
}

# ─── HTTP (redirect para HTTPS) ─────────────────────────────
server {
    listen 80;
    server_name barize.local;
    return 301 https://$host$request_uri;
}

# ─── HTTPS ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name barize.local;

    # SSL (auto-assinado para LAN - usar Let's Encrypt em produção)
    ssl_certificate /etc/nginx/ssl/barize.crt;
    ssl_certificate_key /etc/nginx/ssl/barize.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Logs
    access_log /var/log/nginx/barize_access.log;
    error_log /var/log/nginx/barize_error.log;

    # ─── Frontend (SPA / Modo Quiosque) ────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Headers para Kiosk Mode (evitar cache)
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }

    # ─── API Backend ───────────────────────────────────────
    location /api/ {
        proxy_pass http://barize_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        # Rate limiting (proteção básica)
        limit_req zone=api burst=20 nodelay;
    }

    # ─── Documentação (apenas em debug) ────────────────────
    location /docs {
        proxy_pass http://barize_api;
        proxy_set_header Host $host;
        allow 127.0.0.1;
        allow 192.168.0.0/16;
        deny all;
    }

    location /redoc {
        proxy_pass http://barize_api;
        proxy_set_header Host $host;
        allow 127.0.0.1;
        allow 192.168.0.0/16;
        deny all;
    }

    # ─── OpenAPI JSON ──────────────────────────────────────
    location /openapi.json {
        proxy_pass http://barize_api;
        proxy_set_header Host $host;
        allow 127.0.0.1;
        allow 192.168.0.0/16;
        deny all;
    }
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
