# ─────────────────────────────────────────────────────────────
# BARIZE - Docker Compose (Produção)
# Pilar 1: Infraestrutura Física - Conteinerização
# Pilar 2: Arquitetura de Software - Docker
# Pilar 3: Banco de Dados - PostgreSQL
# Pilar 4: Integração de Hardware - Worker
# ─────────────────────────────────────────────────────────────

version: "3.9"

services:
  # ─── Banco de Dados PostgreSQL ───────────────────────────
  db:
    image: postgres:16-alpine
    container_name: barize-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barize_secret}
      POSTGRES_DB: ${POSTGRES_DB:-barize}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5432:5432"  # Não expor externamente
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barize}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - barize_network

  # ─── Backend API (FastAPI) ───────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: barize-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_logs:/var/log/barize
      - ./backups:/backups
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-barize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barize_secret}
      POSTGRES_DB: ${POSTGRES_DB:-barize}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NODE_ENV: ${NODE_ENV:-production}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:8000:8000"  # Apenas localhost (não expor)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - barize_network

  # ─── Worker de Impressão ─────────────────────────────────
  worker-impressao:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: barize-worker-impressao
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - worker_logs:/var/log/barize
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-barize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barize_secret}
      POSTGRES_DB: ${POSTGRES_DB:-barize}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PRINTER_HOST: ${PRINTER_HOST:-}
      PRINTER_PORT: ${PRINTER_PORT:-9100}
    devices:
      - /dev/usb/lp0:/dev/usb/lp0
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - barize_network

  # ─── Worker de Alertas ───────────────────────────────────
  worker-alertas:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: barize-worker-alertas
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.worker.alerta_worker
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-barize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barize_secret}
      POSTGRES_DB: ${POSTGRES_DB:-barize}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - barize_network

  # ─── Nginx (Proxy Reverso + Kiosk Mode) ──────────────────
  nginx:
    image: nginx:alpine
    container_name: barize-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/barize.conf:/etc/nginx/conf.d/barize.conf:ro
      - nginx_logs:/var/log/nginx
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - barize_network

volumes:
  postgres_data:
  backend_logs:
  worker_logs:
  nginx_logs:
  frontend_build:

networks:
  barize_network:
    driver: bridge
