<style>
        .neon-glow {
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        .neon-glow:focus-within {
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.7);
            border-color: #00e5ff;
        }
        .bg-mixology-pattern {

        }
        /* Custom input autofill override for dark theme */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #1c1b1b inset !important;
            -webkit-text-fill-color: #e5e2e1 !important;

<body class="text-on-background min-h-screen font-body-md antialiased overflow-hidden selection:bg-primary-container selection:text-on-primary-container" style="background-color: rgb(0, 0, 0);">

<div class="relative z-10 min-h-screen flex flex-col justify-center items-center p-lg md:p-xl w-full max-w-md mx-auto">
<header class="w-full flex flex-col items-center mb-xl">
<div class="w-48 h-auto mb-md flex items-center justify-center">
<img alt="Barize Logo" class="w-full h-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1Wju_En_SfnWlvcQQortDTno-uNshRVKtqlIv4eDeW2osNEcYvO1rElKWUtxnRpm-lnrANyjGZc3RmgR6k3ji-47_Wd0lDx7xwhtnZjT-LL-zkDfI5ZSVlI9u65YsQN2y0Tg8_tecS6ZhcSxlHvusThrvYr3XqrCAbD2JsH8BhnAXiBuMqQBf7K_PzqdaRueJvsTmlvmimaR1QUXiMd1-gU1sSidYo8UhtW72Pk4Io055wHZHmVzusfMx4">
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface text-center mt-sm">Bem-vindo ao Barize</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-xs">Gestão de Alta Coquetelaria</p>
</header>
<main class="w-full">
<form action="#" class="space-y-lg flex flex-col w-full" id="loginForm" method="POST">
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase ml-xs" for="username">E-mail ou Usuário</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary-container transition-colors">person</span>
<input autocomplete="username" class="w-full h-touch-target bg-surface-container-low border border-outline-variant rounded-lg pl-[48px] pr-md py-sm text-on-surface placeholder:text-outline focus:outline-none focus:ring-0 focus:border-b-2 focus:border-b-primary-container transition-all" id="username" name="username" placeholder="Seu acesso..." required="" type="text">
</div>
</div>
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase ml-xs" for="password">Senha</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary-container transition-colors">lock</span>
<input autocomplete="current-password" class="w-full h-touch-target bg-surface-container-low border border-outline-variant rounded-lg pl-[48px] pr-md py-sm text-on-surface placeholder:text-outline focus:outline-none focus:ring-0 focus:border-b-2 focus:border-b-primary-container transition-all" id="password" name="password" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="flex justify-between items-center w-full mt-sm">
<a class="font-body-md text-body-md text-primary-container hover:text-primary transition-colors" href="#">Esqueci minha senha</a>
</div>
<button class="w-full h-touch-target mt-xl bg-primary-container text-black font-headline-md text-headline-md rounded-lg flex items-center justify-center neon-glow hover:bg-primary transition-all active:scale-[0.98]" type="submit">
                    Entrar
                </button>
</form>
<div class="mt-xl text-center w-full flex flex-col items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Primeiro turno?</span>
<a class="font-body-md text-body-md text-primary-container hover:text-primary mt-xs border-b border-transparent hover:border-primary transition-all" href="#">Solicitar acesso</a>
</div>
</main>
<footer class="mt-auto pt-xl w-full text-center">
<p class="font-label-md text-label-md text-outline-variant">© 2024 Barize. Velocity Dark.</p>
</footer>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const togglePasswordBtn = document.querySelector('button[aria-label="Toggle password visibility"]');
            const passwordInput = document.getElementById('password');
            const icon = togglePasswordBtn.querySelector('.material-symbols-outlined');

            togglePasswordBtn.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.textContent = 'visibility';
                } else {
                    passwordInput.type = 'password';
                    icon.textContent = 'visibility_off';
                }
            });

            // Prevent form submit for demo
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button[type="submit"]');
                const originalText = btn.textContent;
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 1500);
            });
        });
    </script>
