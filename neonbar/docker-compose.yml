version: "3.9"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: barize-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./barize_dev.db
      - SECRET_KEY=dev-secret-change-in-production
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend/app:/app/app
      - ./backend/barize_dev.db:/app/barize_dev.db
      - barize_logs:/var/log/barize
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: node:22-alpine
    container_name: barize-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      api:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://api:8000

volumes:
  barize_logs:
